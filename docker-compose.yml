version: '3.8'

services:
  db:
    image: postgres:15
    container_name: dxscan_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: dxscan_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-adminpassword}@db:5432/${DB_NAME:-dxscan_db}
    ports:
      - "8000:8000"
    depends_on:
      - db

  dashboard:
    build: ./frontend
    container_name: dxscan_dashboard
    environment:
      - API_URL=http://api:8000/api/v1/inventory/
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: